<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciao</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main>
      <div class="content">
        <h1 class="ciao">Ciao</h1>
        <div class="actions">
          <a href="galleria.html" class="btn-galleria">Galleria</a>
          <a href="db.html" class="btn-galleria btn-db">DB</a>
        </div>
      </div>
    </main>
    <script>
      const ciao = document.querySelector('.ciao');
      ciao.addEventListener('mouseenter', () => {
        if (!ciao.classList.contains('animating')) {
          ciao.classList.add('animating');
        }
      });
      ciao.addEventListener('animationend', () => {
        ciao.classList.remove('animating');
      });
    </script>
  </body>
</html>
